<!--page

 "title": "Contact & Start a Project | Grid and Glint",
 "description": "Start a project with Grid and Glint: send a short brief, or email or call us. We reply within two working days. Brand identity, Webflow and Custom Systems.",
 "crumb": "Contact",
 "type": "ContactPage"}
-->
<main id="top">
  <section class="page-hero wrap" aria-labelledby="h1">
    <div class="xs"><span class="x"></span><span class="x"></span><span class="x"></span></div>
    <div class="inner">
      <nav class="crumbs lbl" aria-label="Breadcrumb"><a href="/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Contact</span></nav>
      <h1 class="disp" id="h1">Start a project</h1>
      <p class="lede">Tell us what you need. We reply within two working days, set up a call, and send a written proposal within 48 hours of it.</p>
    </div>
  </section>

  <section class="sec cta wrap" id="contact" aria-label="Project form and contact details">
    <div class="xs"><span class="x"></span><span class="x"></span><span class="x"></span></div>
    <div class="inner">
      <div class="cta-grid">
        <!-- Webflow takes the submissions: its native Form Block carries these
             same fields and classes. The reference page sends nothing. -->
        <div class="brief-wrap">
          <form class="brief" id="brief" name="start-a-project" aria-label="Start a project" action="">
            <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" type="text" autocomplete="name" maxlength="120" required></div>
            <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" maxlength="200" required></div>
            <div class="field"><label for="f-phone">Phone <span>(optional)</span></label><input id="f-phone" name="phone" type="tel" autocomplete="tel" maxlength="40"></div>
            <div class="field"><label id="need-label">What do you need? (pick any)</label><div class="chips" role="group" aria-labelledby="need-label"><label class="chip"><input type="checkbox" name="Brand identity"><span class="w-form-label">Brand identity</span></label><label class="chip"><input type="checkbox" name="Webflow website"><span class="w-form-label">Webflow website</span></label><label class="chip"><input type="checkbox" name="Launch"><span class="w-form-label">Launch (brand + website)</span></label><label class="chip"><input type="checkbox" name="Custom Systems"><span class="w-form-label">Custom Systems</span></label><label class="chip"><input type="checkbox" name="Full Build"><span class="w-form-label">Full Build</span></label><label class="chip"><input type="checkbox" name="Monthly support"><span class="w-form-label">Monthly support</span></label><label class="chip"><input type="checkbox" name="Free Teardown"><span class="w-form-label">Free Teardown</span></label><label class="chip"><input type="checkbox" name="Not sure yet"><span class="w-form-label">Not sure yet</span></label></div></div>
            <div class="field"><label for="f-site">Website <span>(optional)</span></label><input id="f-site" name="website" type="url" maxlength="300"></div>
            <div class="field"><label for="f-msg">What are you launching, and when?</label><textarea id="f-msg" name="message" rows="5" maxlength="5000" required></textarea></div>
            <input class="btn mag" type="submit" value="Send &#8594;">
          </form>
          <div class="w-form-done" hidden>Thanks. We will reply within two working days.</div>
          <div class="w-form-fail" hidden>That did not send. Email us at info@gridandglint.com instead.</div>
        </div>
        <!--@mailbox-->
      </div>
    </div>
  </section>
</main>
